services:
  db:
    image: postgres:15
    container_name: cryptofile_db
    restart: always
    environment:
      POSTGRES_USER: cryptofile
      POSTGRES_PASSWORD: cryptofile
      POSTGRES_DB: cryptofile
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: .
    container_name: cryptofile_api
    depends_on:
      - db
    volumes:
      - .:/app
      - ./uploads:/app/uploads  
    environment:
      DATABASE_URL: postgresql+psycopg2://cryptofile:cryptofile@db:5432/cryptofile
      JWT_SECRET: supersecret
    ports:
      - "8000:8000"
    command: >
      sh -c "
      sleep 5 &&
      alembic -c /app/alembic.ini upgrade head &&
      uvicorn main:app --host 0.0.0.0 --port 8000
      "

volumes:
  postgres_data: