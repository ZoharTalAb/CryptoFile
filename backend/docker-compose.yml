services:
  db:
    image: postgres:15
    container_name: cryptofile_db
    restart: always
    environment:
      POSTGRES_USER: cryptofile
      POSTGRES_PASSWORD: cryptofile
      POSTGRES_DB: cryptofile
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptofile -d cryptofile"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: cryptofile_api
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - uploads_data:/app/uploads
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://cryptofile:cryptofile@db:5432/cryptofile
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  uploads_data: